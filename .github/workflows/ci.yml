# Runs Bastion's quality gates on every pull request.
#
# One job, named "CI", so branch protection needs only one required check.
# Each gate is its own step, and later steps run even when an earlier one
# fails (as long as install worked), so one run shows every problem.

name: CI

on:
  pull_request:

permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version in package.json's "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm --filter @bastion/tokens build

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      # Story tests run in headless Chromium.
      - name: Install Playwright Chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @bastion/ui exec playwright install --with-deps chromium

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build Storybook
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @bastion/ui build-storybook

      # Download from the run's Summary page to browse this PR's Storybook.
      - name: Upload Storybook
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: packages/ui/storybook-static
          retention-days: 7
          if-no-files-found: ignore

# Releases @vineethbangera/tokens and @vineethbangera/ui to GitHub Packages.
#
# On every push to main, Changesets does one of two things:
# - If there are changesets in .changeset/, it opens (or updates) a
#   "Version Packages" pull request that bumps versions, writes the
#   CHANGELOG.md entries and deletes the changesets it used.
# - If there are none (usually because that pull request just merged), it
#   publishes every package whose version isn't in the registry yet, then
#   tags the commit and creates a GitHub release for each package.
#
# Two tokens, each doing only what it can:
# - RELEASE_TOKEN, a fine-grained personal access token stored as a
#   repository secret, opens and updates the Version Packages pull request
#   and creates the tags and releases. GitHub doesn't start workflows for
#   events caused by the workflow's own GITHUB_TOKEN, so a pull request
#   opened with it would never get the CI check main requires. Events caused
#   by a personal token do start workflows, so CI runs as on any other pull
#   request.
# - GITHUB_TOKEN publishes the packages. Fine-grained tokens can't publish to
#   GitHub Packages, and GITHUB_TOKEN can publish packages linked to this
#   repository, which the "repository" field in each package.json does.

name: Release

on:
  push:
    branches: [main]

# Never run two releases at once: the second waits for the first.
concurrency:
  group: release
  cancel-in-progress: false

# These apply to GITHUB_TOKEN only. RELEASE_TOKEN's access is set when it is
# created: this repository only, Contents and Pull requests read and write.
permissions:
  contents: read
  packages: write # publish to GitHub Packages

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Fails with a clear message instead of halfway through a release.
      - name: Check RELEASE_TOKEN is set
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error title=RELEASE_TOKEN missing::Add a fine-grained token as the RELEASE_TOKEN repository secret. See README, Releasing."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Authenticate with GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Version pull request or publish
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          version-script: pnpm changeset version
          publish-script: pnpm release
          commit-message: Version Packages
          pr-title: Version Packages
        env:
          # Read by the changelog generator to link pull requests and authors.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

